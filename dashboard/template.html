<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Pricing Dashboard</title>
<style>
:root{--ink:#1F2937;--mute:#6B7280;--line:#E5E7EB;--a:#1D4E89;--b:#5B84B1;--c:#9DB7D5;--d:#C9D6E6;--bg:#F3F6FA}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff}
header{padding:16px 28px 0;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 2px}header p{margin:0 0 10px;color:var(--mute);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;padding:9px 14px;font:inherit;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--a);border-color:var(--a);font-weight:600}
main{padding:20px 28px;max-width:1280px}.page{display:none}.page.on{display:block}
h2{font-size:16px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 14px;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--bg);border-radius:6px;padding:12px 14px}.kpi b{display:block;font-size:26px;color:var(--a);font-weight:600}.kpi span{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card h3{font-size:13px;margin:0 0 6px}
svg text{font:11px "Segoe UI",sans-serif;fill:var(--mute)}svg .t{fill:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}td.n,th.n{text-align:right}
.note{margin-top:18px;padding-top:8px;border-top:1px solid var(--line);color:var(--mute);font-size:11.5px}
.ctl{display:flex;gap:30px;margin-bottom:14px}.ctl label{font-size:12px;color:var(--mute);display:block}.ctl b{color:var(--a)}
input[type=range]{width:240px;accent-color:var(--a)}.bar{display:inline-block;height:8px;background:var(--b);border-radius:2px;vertical-align:middle}
@media(max-width:800px){.grid,.kpis{grid-template-columns:1fr}.ctl{flex-direction:column;gap:10px}}
</style></head><body>
<header><h1>Hospital Pricing, Payment &amp; Documentation Opportunity</h1>
<p>Medicare inpatient, CMS data year 2023 · 2,945 hospitals · 534 service lines</p>
<nav id="nav"></nav></header><main id="m"></main>
<script>
const D=__DATA__;
const $=(s,e=document)=>e.querySelector(s),B=v=>"$"+(v/1e9).toFixed(1)+"B",M=v=>"$"+(v/1e6).toFixed(1)+"M",P=(v,k=1)=>(v*100).toFixed(k)+"%";
const C={a:"#1D4E89",b:"#5B84B1",c:"#9DB7D5",d:"#C9D6E6",g:"#9CA3AF"};
const NOTE='<div class="note">Charges are list prices; the gap is descriptive, not recoverable revenue. Source: CMS Medicare Inpatient Hospitals by Provider and Service, 2023.</div>';
function hbar(rows,o={}){const w=o.w||560,lab=o.lab||150,fmt=o.fmt||(v=>v),rowH=o.rowH||22,fill=o.fill||C.a,max=o.max||Math.max(...rows.map(r=>r.v));const h=rows.length*rowH+4;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%">`+rows.map((r,i)=>{const y=i*rowH+2,bw=(w-lab-60)*r.v/max;
 return `<text class="t" x="${lab-6}" y="${y+14}" text-anchor="end">${r.l}</text><rect x="${lab}" y="${y+3}" width="${bw}" height="${rowH-8}" fill="${r.f||fill}" rx="2"/><text x="${lab+bw+5}" y="${y+14}">${fmt(r.v)}</text>`}).join("")+"</svg>"}
function cols(rows,o={}){const w=560,h=230,fmt=o.fmt||(v=>v),fill=o.fill||C.a,ref=o.ref,max=Math.max(...rows.map(r=>r.v))*1.15,bw=(w-40)/rows.length;
 let s=`<svg viewBox="0 0 ${w} ${h}" width="100%">`;if(ref!=null){const y=h-24-(h-44)*ref/max;s+=`<line x1="30" x2="${w}" y1="${y}" y2="${y}" stroke="${C.g}" stroke-dasharray="3 3"/>`}
 rows.forEach((r,i)=>{const bh=(h-44)*r.v/max,x=34+i*bw;s+=`<rect x="${x+4}" y="${h-24-bh}" width="${bw-8}" height="${bh}" fill="${fill}" rx="2"/><text x="${x+bw/2}" y="${h-24-bh-4}" text-anchor="middle">${fmt(r.v)}</text><text x="${x+bw/2}" y="${h-8}" text-anchor="middle">${r.l}</text>`});return s+"</svg>"}
function scatter(){const W=1180,H=300,L=44,Bt=28,pts=D.hosp.filter(x=>x.ci<3.2&&x.pi<2.2),mx=3.2,my=2.2,X=v=>L+(W-L-10)*v/mx,Y=v=>H-Bt-(H-Bt-10)*v/my;
 const col={"Large high-charge systems":C.a,"Large mainstream systems":C.b,"High-payment complex-care centres":"#1F2937","Community & rural hospitals":C.c,"Small metro hospitals":C.g};
 let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%">`;for(let v=0;v<=mx;v+=0.5)s+=`<text x="${X(v)}" y="${H-10}" text-anchor="middle">${v.toFixed(1)}</text>`;
 for(let v=0;v<=my;v+=0.5)s+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E5E7EB"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`;
 pts.forEach(x=>s+=`<circle cx="${X(x.ci)}" cy="${Y(x.pi)}" r="2.6" fill="${col[x.seg]||C.g}" fill-opacity=".55"/>`);
 s+=`<line x1="${X(1)}" x2="${X(1)}" y1="10" y2="${H-Bt}" stroke="${C.g}" stroke-dasharray="3 3"/><line x1="${L}" x2="${W}" y1="${Y(1)}" y2="${Y(1)}" stroke="${C.g}" stroke-dasharray="3 3"/>`;
 Object.entries(col).forEach(([k,c],i)=>s+=`<circle cx="${L+14+i*215}" cy="${H+6}" r="4" fill="${c}"/><text x="${L+22+i*215}" y="${H+10}">${k}</text>`);return s+"</svg>"}
function pareto(h){const W=560,Hh=260,L=40,R=20,bw=(W-L-R)/h.length,mx=Math.max(...h.map(x=>x.gap))*1.1,top=h[h.length-1].cum;let s=`<svg viewBox="0 0 ${W} ${Hh}" width="100%">`;
 h.forEach((x,i)=>{const bh=(Hh-30)*x.gap/mx;s+=`<rect x="${L+i*bw+1}" y="${Hh-20-bh}" width="${bw-2}" height="${bh}" fill="${C.a}"/>`});
 s+=`<polyline fill="none" stroke="${C.g}" stroke-width="2" points="${h.map((x,i)=>`${L+i*bw+bw/2},${Hh-20-(Hh-30)*x.cum/top}`).join(" ")}"/>`;
 s+=`<text x="${L}" y="${Hh-4}">rank 1</text><text x="${W-R}" y="${Hh-4}" text-anchor="end">rank 50</text><text x="${W-R}" y="150" text-anchor="end">Line: top 50 hospitals = ${P(top,0)} of the gap</text><text x="4" y="12">${B(h[0].gap)}</text>`;return s+"</svg>"}
const pages={
"1. Executive summary":()=>{const n=D.national,st=[...D.states].sort((a,b)=>b.ci-a.ci),sel=st.slice(0,8).concat(st.slice(-4));
 return `<h2>The $344B gap is a list-price effect, concentrated in a few service lines</h2><p class="sub">${P(n.gap/n.charges,0)} of charges are not paid. Medicare pays a fixed rate per DRG regardless of what a hospital lists.</p>
 <div class="kpis"><div class="kpi"><b>${B(n.charges)}</b><span>Total charges</span></div><div class="kpi"><b>${B(n.payment)}</b><span>Total payments</span></div><div class="kpi"><b>${P(n.pcr)}</b><span>Payment-to-charge ratio</span></div><div class="kpi"><b>${B(n.gap)}</b><span>Charge gap (descriptive)</span></div></div>
 <div class="grid"><div class="card"><h3>Ten service lines with the largest gap (share of total)</h3>${hbar(D.drgs.map(d=>({l:d.t.slice(0,52)+(d.t.length>52?"...":""),v:d.share})),{lab:330,w:640,fmt:v=>P(v)})}</div>
 <div class="card"><h3>Charge index by state, same DRG mix (1.00 = national)</h3>${hbar(sel.map((s,i)=>({l:s.s,v:s.ci,f:i<8?C.a:C.d})),{lab:40,fmt:v=>v.toFixed(2),rowH:20})}<p class="sub">Top 8 and bottom 4 states. Maryland regulates hospital prices.</p></div></div>`+NOTE},
"2. Why the gap exists":()=>{const dc=D.deciles;
 return `<h2>Charges rise ${(dc[9].ci/dc[0].ci).toFixed(1)}x across deciles; payments barely move</h2><p class="sub">Hospitals sorted into ten equal groups by charge index. The payment-to-charge ratio falls because of what is listed, not what is paid.</p>
 <div class="grid"><div class="card"><h3>Charge index by decile (dashed line = national, 1.00)</h3>${cols(dc.map(d=>({l:"D"+d.d,v:d.ci})),{fmt:v=>v.toFixed(2),ref:1})}</div>
 <div class="card"><h3>Payment index by decile (dashed line = national, 1.00)</h3>${cols(dc.map(d=>({l:"D"+d.d,v:d.pi})),{fmt:v=>v.toFixed(2),fill:C.b,ref:1})}</div></div>
 <div class="card" style="margin-top:18px"><h3>Each dot is a hospital: charge index (x) vs payment index (y)</h3>${scatter()}</div>`+NOTE},
"3. Concentration":()=>{const h=D.hosp.slice(0,50);
 return `<h2>${D.n50} hospitals (${P(D.n50/D.n_hosp,0)}) account for half of the gap</h2><p class="sub">Top 50 hospitals by charge gap, with cumulative share of the national gap.</p>
 <div class="grid"><div class="card"><h3>Gap by hospital (top 50) and cumulative share</h3>${pareto(h)}</div>
 <div class="card"><h3>Hospital segments</h3><table><tr><th>Segment</th><th class="n">Hospitals</th><th class="n">Gap share</th><th class="n">Pay/charge</th><th class="n">Charge idx</th></tr>${[...D.segments].sort((a,b)=>b.gap_share-a.gap_share).map(s=>`<tr><td>${s.seg}</td><td class="n">${s.n}</td><td class="n">${P(s.gap_share)}</td><td class="n">${P(s.pcr)}</td><td class="n">${s.ci.toFixed(2)}</td></tr>`).join("")}</table>
 <h3 style="margin-top:14px">Largest five hospital gaps</h3><table>${D.hosp.slice(0,5).map(x=>`<tr><td>${x.n}</td><td>${x.st}</td><td class="n">${B(x.gap)}</td><td class="n">${x.ci.toFixed(2)}</td></tr>`).join("")}</table></div></div>`+NOTE},
"4. Documentation opportunity":()=>`<h2>The lever hospitals control: severity documentation</h2><p class="sub">Hospitals billing a lighter case mix than peers, valued at national DRG payments. Screen only: clinicians and compliance decide what is supportable.</p>
 <div class="ctl"><div><label>Review threshold (shortfall vs peers): <b id="tv"></b></label><input id="th" type="range" min="0" max="0.05" step="0.005" value="0.02"></div>
 <div><label>Capture rate: <b id="cv"></b></label><input id="cr" type="range" min="0.05" max="0.5" step="0.05" value="0.25"></div></div>
 <div class="kpis"><div class="kpi"><b id="k1"></b><span>Eligible hospitals</span></div><div class="kpi"><b id="k2"></b><span>Eligible shortfall</span></div><div class="kpi"><b id="k3"></b><span>Documentation opportunity</span></div><div class="kpi"><b id="k4"></b><span>25-hospital pilot</span></div></div>
 <div class="card"><h3>Largest shortfalls vs peers</h3><table id="tb"></table></div>`+NOTE};
function renderSev(){const t=+$("#th").value,c=+$("#cr").value;$("#tv").textContent=P(t);$("#cv").textContent=P(c,0);
 const el=D.sev.filter(x=>x.short>0&&x.pct>=t).map(x=>({...x,s:x.short})),tot=el.reduce((a,x)=>a+x.s,0),top=[...el].sort((a,b)=>b.s-a.s),pil=top.slice(0,25).reduce((a,x)=>a+x.s,0);
 $("#k1").textContent=el.length;$("#k2").textContent=M(tot);$("#k3").textContent=M(tot*c);$("#k4").textContent=M(pil*c);
 const mx=top[0]?top[0].s:1;$("#tb").innerHTML="<tr><th>Hospital</th><th>State</th><th class='n'>Shortfall</th><th></th><th class='n'>Below peers</th></tr>"+top.slice(0,12).map(x=>`<tr><td>${x.n}</td><td>${x.st}</td><td class="n">${M(x.s)}</td><td><span class="bar" style="width:${120*x.s/mx}px"></span></td><td class="n">${P(x.pct)}</td></tr>`).join("")}
const nav=$("#nav"),m=$("#m");Object.keys(pages).forEach((k,i)=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>show(i);nav.appendChild(b);const p=document.createElement("section");p.className="page";p.innerHTML=pages[k]();m.appendChild(p)});
function show(i){[...nav.children].forEach((b,j)=>b.classList.toggle("on",i==j));[...m.children].forEach((p,j)=>p.classList.toggle("on",i==j))}
$("#th").oninput=$("#cr").oninput=renderSev;renderSev();show(+(location.hash.slice(1)||0));
</script></body></html>
